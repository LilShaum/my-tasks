# Publishes this repository to GitHub Pages on every push to main.
#
# `enablement: true` on configure-pages turns Pages on for the repository the
# first time this runs, so there is nothing to switch on by hand in Settings.
#
# The site is served as-is — Kittycal has no build step and no dependencies,
# so the files in the repo are the files that get deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
