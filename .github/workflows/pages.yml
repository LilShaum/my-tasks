# Publishes this repository to GitHub Pages on every push to main.
#
# `enablement: true` on configure-pages turns Pages on for the repository the
# first time this runs, so there is nothing to switch on by hand in Settings.
#
# The site is served as-is — Kittycal has no build step and no dependencies,
# so the files in the repo are the files that get deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stamp the service worker with this commit.
      #
      # Kittycal's service worker is cache-first, which is what makes an
      # installed copy open instantly and work with no signal. The cost is that
      # an installed copy keeps serving whatever it cached until the *worker
      # script itself* changes — browsers only reinstall a service worker when
      # its bytes differ. With a hand-written version constant, forgetting to
      # bump it means a deploy that ships to the website and silently never
      # reaches the phones that already have the app.
      #
      # So the version isn't hand-written. Every deploy stamps in the commit
      # SHA, which guarantees the bytes change, which guarantees the worker
      # reinstalls and re-fetches every file. There is nothing left to remember.
      - name: Version the service worker
        run: |
          sed -i "s|__BUILD__|${GITHUB_SHA}|" kittycal/sw.js
          grep -n 'CACHE_VERSION' kittycal/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The default is 10 minutes, and a deploy has already been aborted
          # mid-`purging_cdn` at that mark — the CDN purge occasionally takes
          # longer than that on GitHub's side. A failure here is silent from the
          # outside: the site simply keeps serving the previous version, so
          # give it room rather than have changes quietly not ship.
          timeout: 1200000
