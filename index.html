<!doctype html>
<!--
  KittyCal — Hello Kitty period tracker
  Improved index.html — changes from original:
    • data-theme="hellokitty" and data-pattern="gingham" set as defaults
      so first-time users land in the Hello Kitty theme, not a generic fallback.
    • viewport-fit=cover added for iPhone notch/home-indicator safe areas.
    • color-scheme meta for OS-level dark-mode respect before CSS loads.
    • Improved title and description.
    • apple-touch-icon for iOS add-to-home-screen.
    • Preload for Fredoka (display font) so the ring headline doesn't flash.
    • theme-color meta updated to match Hello Kitty primary at L68.
-->
<html lang="en" data-theme="hellokitty" data-pattern="gingham">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description"
        content="KittyCal — a Hello Kitty period tracker that lives on your phone, works offline, and keeps your data private." />
  <!-- Pink matching hellokitty theme primary oklch(68% 0.145 18) ≈ #e8705a -->
  <meta name="theme-color" content="#e8705a" />

  <title>KittyCal</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />

  <!--
    Fonts.
    Fredoka is the display face (ring headline, buttons, big numbers).
    Nunito is the body face.
    Both are bundled in assets/fonts/ for offline use;
    the Google Fonts URLs are the fallback while the SW primes its cache.
    preload the display font so the ring number doesn't FOUT.
  -->
  <link rel="preload" href="assets/fonts/fredoka.woff2"
        as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/nunito.woff2"
        as="font" type="font/woff2" crossorigin />

  <!--
    Single merged stylesheet (tokens → themes → layout → components → views).
    When deploying the full app, split back into the individual files in css/.
  -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>

<body>
  <!--
    Background pattern layer.
    Fixed, z-1, pointer-events:none — sits behind everything.
    The active pattern class on <html> drives which CSS pattern is rendered.
  -->
  <div class="app-bg" aria-hidden="true"></div>

  <!--
    Boot screen.
    Shown on first paint; JS removes data-hide once the DB is ready.
    wobble animation is in components.css.
  -->
  <div class="boot" id="boot">
    <img class="boot-art" src="assets/icons/icon.svg" alt="" aria-hidden="true" />
  </div>

  <!--
    Toast notification host.
    aria-live="polite" so screen readers announce toasts without interrupting.
    Contents are injected by js/ui/toast.js.
  -->
  <div class="toast-host" id="toast-host"
       aria-live="polite" aria-atomic="true" role="status"></div>

  <!--
    Sheet backdrop.
    Covers the page when a bottom sheet is open.
    data-open toggled by js/ui/sheet.js, which also manages aria-modal.
  -->
  <div class="sheet-backdrop" id="sheet-backdrop"
       data-open="false" aria-hidden="true"></div>

  <!--
    App shell — the phone-column layout.
    Rendered content goes in #view-* sections.
    Navigation is the fixed tab bar at the bottom.
  -->
  <div class="shell" id="shell" hidden>

    <!-- Sticky app header: mascot + view title + contextual actions -->
    <header class="app-head" id="app-head">
      <h1 id="view-title">
        <!--
          Mascot SVG is injected here by js/ui/mascot.js.
          It reacts to logging (mascot-bob) and cycle closes (mascot-cheer)
          as defined in components.css.
        -->
        <span class="mascot-mini sticker" id="header-mascot" aria-hidden="true"></span>
        <span id="head-title-text">KittyCal</span>
      </h1>
      <!-- Per-view action buttons (settings, export, etc.) injected here -->
      <div id="head-actions" class="head-actions"></div>
    </header>

    <!-- ── Views ────────────────────────────────────────────────────────── -->
    <main id="main">

      <!--
        TODAY — the daily loop.
        Contains: greeting, cycle ring, week strip, phase line, check-in or
        logged state, prediction cards, tips scroller, backup/install nudges.
        Rendered by js/views/today.js.
      -->
      <section class="view" id="view-today"
               role="main" aria-labelledby="head-title-text">
      </section>

      <!--
        CALENDAR — month and year views.
        Rendered by js/views/calendar.js.
      -->
      <section class="view" id="view-calendar" hidden
               aria-label="Calendar">
      </section>

      <!--
        LOG — diary of all recorded days.
        Rendered by js/views/log.js.
      -->
      <section class="view" id="view-log" hidden
               aria-label="Log">
      </section>

      <!--
        INSIGHTS — charts and stats.
        Rendered by js/views/insights.js.
      -->
      <section class="view" id="view-insights" hidden
               aria-label="Insights">
      </section>

      <!--
        NOTES — free-text journal, never analysed.
        Rendered by js/views/notes.js.
      -->
      <section class="view" id="view-notes" hidden
               aria-label="Notes">
      </section>

      <!--
        SETTINGS — cycle length, reminders, theme, lock, data.
        Rendered by js/views/settings.js.
      -->
      <section class="view" id="view-settings" hidden
               aria-label="Settings">
      </section>

      <!--
        HELP — how the app works, what each phase means.
        Rendered by js/views/help.js.
      -->
      <section class="view" id="view-help" hidden
               aria-label="Help">
      </section>

      <!--
        REPORT — shareable one-page summary for doctor appointments.
        Rendered by js/views/report.js.
      -->
      <section class="view" id="view-report" hidden
               aria-label="Report for doctor">
      </section>

      <!--
        STICKERS — earned milestones displayed as a collection.
        Rendered by js/views/stickers.js.
      -->
      <section class="view" id="view-stickers" hidden
               aria-label="Sticker collection">
      </section>

    </main>

    <!--
      Tab bar.
      Four primary destinations; all others reachable from Settings or
      the header action buttons. Each tab is a button with aria-selected.
      SVGs are injected by js/main.js so they stay in sync with the icon
      set used by views.
    -->
    <nav class="tabbar" id="tabbar" aria-label="Main navigation">
      <!--
        Tab buttons are injected by js/main.js.
        Expected order: Today, Calendar, Log, Insights.
        Each gets: class="tab", aria-selected="true|false", data-view="..."
      -->
    </nav>

  </div><!-- /.shell -->

  <!--
    Onboarding flow.
    Fullscreen; shown instead of .shell on first run.
    Rendered and dismissed by js/views/onboarding.js.
  -->
  <div class="onb" id="onboarding" hidden
       aria-label="Welcome to KittyCal">
  </div>

  <!--
    Lock screen.
    Overlays everything when a PIN is set and the app loses focus.
    Rendered by js/ui/lock.js.
  -->
  <div class="view" id="view-lock" hidden
       aria-label="Locked">
  </div>

  <!--
    Service worker registration.
    Happens before the app module so the SW is ready to intercept
    network requests during the first JS evaluation.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

  <!-- App entry point — ES module, loads after DOM is parsed -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
