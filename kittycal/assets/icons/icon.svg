<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Kittycal app icon. Original artwork: a ribbon bow over a calendar page.
    Colours are baked in rather than tokenised because a home-screen icon can't
    read CSS custom properties.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f4"/>
      <stop offset="1" stop-color="#ffdfe6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Calendar page -->
  <rect x="112" y="150" width="288" height="256" rx="40"
        fill="#ffffff" stroke="#8c3a48" stroke-width="16"/>
  <path d="M112 226 H400" stroke="#8c3a48" stroke-width="16"/>
  <path d="M184 150 V116 M328 150 V116"
        stroke="#8c3a48" stroke-width="20" stroke-linecap="round"/>

  <!-- Cycle dots: two logged, one predicted -->
  <circle cx="180" cy="290" r="22" fill="#e8465a"/>
  <circle cx="256" cy="290" r="22" fill="#e8465a"/>
  <circle cx="332" cy="290" r="20" fill="none" stroke="#e8465a"
          stroke-width="8" stroke-dasharray="10 8"/>
  <circle cx="180" cy="356" r="16" fill="#f2c14e"/>
  <circle cx="256" cy="356" r="16" fill="#f2c14e" opacity="0.55"/>

  <!-- Ribbon bow -->
  <g transform="translate(0 -14)">
    <path d="M256 148 C222 108 138 108 132 148 C138 190 222 190 256 148Z"
          fill="#e8465a" stroke="#8c3a48" stroke-width="16" stroke-linejoin="round"/>
    <path d="M256 148 C290 108 374 108 380 148 C374 190 290 190 256 148Z"
          fill="#e8465a" stroke="#8c3a48" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="256" cy="149" r="27" fill="#f2c14e"
            stroke="#8c3a48" stroke-width="16"/>
  </g>
</svg>
